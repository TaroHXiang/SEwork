services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: ann-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
