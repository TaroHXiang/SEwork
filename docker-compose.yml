services:
  mysql:
    image: mysql:8.4
    container_name: ann-mysql
    ports:
      - "3307:3306"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sework
      MYSQL_USER: sework
      MYSQL_PASSWORD: qwerxjl159357
      MYSQL_ROOT_PASSWORD: qwerxjl159357
    volumes:
      - mysql_data:/var/lib/mysql

  faiss:
    build:
      context: .
      dockerfile: Dockerfile.faiss
    container_name: ann-faiss
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      FAISS_INDEX_PATH: /var/lib/faiss
      FAISS_DATA_ROOT: /workspace
    volumes:
      - faiss_storage:/var/lib/faiss
      - ./:/workspace:ro

volumes:
  mysql_data:
  faiss_storage:
