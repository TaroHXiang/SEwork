<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>单细胞相似性检索系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom bg-white">
      <div class="container">
        <span class="navbar-brand fw-semibold">单细胞相似性检索系统</span>
        <span id="healthBadge" class="badge text-bg-secondary">未构建索引</span>
      </div>
    </nav>

    <main class="container py-4">
      <section class="workflow mb-4">
        <div class="workflow-step">读取数据</div>
        <div class="workflow-step">提取细胞向量</div>
        <div class="workflow-step">构建 HNSW 索引</div>
        <div class="workflow-step">Top-K 检索</div>
        <div class="workflow-step">结果展示</div>
      </section>

      <div class="row g-4">
        <section class="col-lg-4">
          <div class="panel">
            <h1 class="h5 mb-3">索引构建</h1>
            <label class="form-label" for="dataPath">数据路径</label>
            <input id="dataPath" class="form-control" value="data/sample_cells.csv">
            <button id="buildIndexBtn" class="btn btn-primary w-100 mt-3">构建索引</button>
            <div id="indexStatus" class="small text-secondary mt-3">等待构建</div>
          </div>
        </section>

        <section class="col-lg-8">
          <div class="panel">
            <ul class="nav nav-tabs" id="queryTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="id-tab" data-bs-toggle="tab" data-bs-target="#id-pane" type="button" role="tab">细胞 ID</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="vector-tab" data-bs-toggle="tab" data-bs-target="#vector-pane" type="button" role="tab">向量</button>
              </li>
            </ul>

            <div class="tab-content pt-3">
              <div class="tab-pane fade show active" id="id-pane" role="tabpanel">
                <div class="row g-3 align-items-end">
                  <div class="col-md-7">
                    <label class="form-label" for="cellId">细胞编号</label>
                    <input id="cellId" class="form-control" value="cell_001">
                  </div>
                  <div class="col-md-2">
                    <label class="form-label" for="topKId">Top-K</label>
                    <input id="topKId" class="form-control" type="number" min="1" max="20" value="5">
                  </div>
                  <div class="col-md-3">
                    <button id="searchByIdBtn" class="btn btn-dark w-100">查询</button>
                  </div>
                </div>
              </div>

              <div class="tab-pane fade" id="vector-pane" role="tabpanel">
                <div class="row g-3 align-items-end">
                  <div class="col-md-7">
                    <label class="form-label" for="queryVector">查询向量</label>
                    <input id="queryVector" class="form-control" value="0.12,0.22,0.31,0.44,0.58,0.62,0.73,0.81">
                  </div>
                  <div class="col-md-2">
                    <label class="form-label" for="topKVector">Top-K</label>
                    <input id="topKVector" class="form-control" type="number" min="1" max="20" value="5">
                  </div>
                  <div class="col-md-3">
                    <button id="searchByVectorBtn" class="btn btn-dark w-100">查询</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="table-responsive mt-4">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>排名</th>
                    <th>细胞编号</th>
                    <th>距离</th>
                    <th>相似度分数</th>
                    <th>细胞类型</th>
                    <th>批次</th>
                  </tr>
                </thead>
                <tbody id="resultsBody">
                  <tr>
                    <td colspan="6" class="text-center text-secondary py-4">暂无查询结果</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
